version: '3.8'

services:
  backend:
    build:
      context: ./payme-backend
      dockerfile: Dockerfile
    container_name: payme-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./payme-backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - payme-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  payme-network:
    driver: bridge

volumes:
  backend-logs:
